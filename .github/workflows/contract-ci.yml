# ═══════════════════════════════════════════════════════════════════════════════
# Smart Contract CI — DTCC/SEC Testing & Quality Requirements
# ═══════════════════════════════════════════════════════════════════════════════
#
# Enforces all PR checks per the DTCC/SEC testing standard:
#   §1  Build (cargo build, stellar contract build, cargo check, clippy, fmt, deny)
#   §2  Coverage (98% CI gate)
#   §3  Unit tests
#   §4  Invariant tests (included in test suite)
#   §5  Property/fuzz tests (included in test suite)
#   §14 CI pipeline requirements
#
# Blocking: All checks must pass before merge.
# Required approvals: 2 (configured in branch protection rules)
# ═══════════════════════════════════════════════════════════════════════════════

name: Contract CI

on:
  pull_request:
    paths:
      - "contracts/**"
      - "Cargo.toml"
      - "Cargo.lock"
  push:
    branches: [main]
    paths:
      - "contracts/**"

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ─── Format Check ────────────────────────────────────────────────────────────
  format:
    name: Format (cargo fmt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check
        working-directory: contracts/item-created-emitter

  # ─── Clippy (Lint) ──────────────────────────────────────────────────────────
  clippy:
    name: Clippy (no warnings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts/item-created-emitter
      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings
        working-directory: contracts/item-created-emitter

  # ─── Dependency Vulnerability Scan ──────────────────────────────────────────
  deny:
    name: Dependency Audit (cargo deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v1
        with:
          manifest-path: contracts/item-created-emitter/Cargo.toml
          command: check

  # ─── Build (Native + WASM) ──────────────────────────────────────────────────
  build:
    name: Build (native + WASM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts/item-created-emitter
      - name: Build (native)
        run: cargo build --release
        working-directory: contracts/item-created-emitter
      - name: Build (WASM)
        run: cargo build --release --target wasm32-unknown-unknown
        working-directory: contracts/item-created-emitter
      - name: Check workspace
        run: cargo check --workspace
        working-directory: contracts/item-created-emitter

  # ─── Soroban/Stellar Contract Build ─────────────────────────────────────────
  soroban-build:
    name: Stellar Contract Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts/item-created-emitter
      - name: Install Stellar CLI
        run: cargo install stellar-cli --locked || cargo install --locked stellar-cli
      - name: Build contract
        run: stellar contract build --package item-created-emitter
        working-directory: contracts/item-created-emitter

  # ─── Tests ──────────────────────────────────────────────────────────────────
  test:
    name: Tests (unit + invariant + fuzz + boundary + event + integration)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts/item-created-emitter
      - name: Run all tests
        run: cargo test --workspace
        working-directory: contracts/item-created-emitter
      - name: Run tests (verbose, for CI logs)
        run: cargo test --workspace -- --nocapture 2>&1 | tail -50
        working-directory: contracts/item-created-emitter

  # ─── Coverage ───────────────────────────────────────────────────────────────
  coverage:
    name: Coverage (98% gate)
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts/item-created-emitter
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked
      - name: Run coverage
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info
        working-directory: contracts/item-created-emitter
      - name: Check coverage threshold (98%)
        run: cargo llvm-cov report --workspace --fail-under-lines 98
        working-directory: contracts/item-created-emitter
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: contract-coverage
          path: contracts/item-created-emitter/lcov.info

  # ─── All Checks Gate ────────────────────────────────────────────────────────
  contract-ci-passed:
    name: Contract CI Passed
    runs-on: ubuntu-latest
    needs: [format, clippy, deny, build, soroban-build, test, coverage]
    steps:
      - name: All contract checks passed
        run: echo "All DTCC/SEC contract CI checks passed."
